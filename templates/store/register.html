{% extends 'base.html' %}

{% block title %}Регистрация — AutoShop{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-lg border-0 p-4">
            <div class="text-center mb-4">
                <h2 style="color:#e94560; font-weight:bold;">🔧 AutoShop</h2>
                <h4 class="mt-2">Создать аккаунт</h4>
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <input type="text" name="username" class="form-control form-control-lg" placeholder="Имя пользователя" required>
                </div>
                <div class="mb-3">
                    <input type="password" name="password1" class="form-control form-control-lg" placeholder="Пароль" required>
                </div>
                <div class="mb-3">
                    <input type="password" name="password2" class="form-control form-control-lg" placeholder="Подтвердите пароль" required>
                </div>
                {% if form.errors %}
                <div class="alert alert-danger">
                    Проверьте введённые данные.
                </div>
                {% endif %}
                <button type="submit" class="btn btn-danger w-100 btn-lg mt-2">Зарегистрироваться</button>
            </form>
            <hr>
            <p class="text-center text-muted mb-0">Уже есть аккаунт? <a href="/login/" style="color:#e94560;">Войти</a></p>
        </div>
    </div>
</div>
{% endblock %}
