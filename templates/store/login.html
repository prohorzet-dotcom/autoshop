{% extends 'base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card p-4">
            <h3 class="mb-4 text-center">Вход в аккаунт</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-danger w-100">Войти</button>
            </form>
            <p class="text-center mt-3">Нет аккаунта? <a href="/register/">Зарегистрироваться</a></p>
        </div>
    </div>
</div>
{% endblock %}
